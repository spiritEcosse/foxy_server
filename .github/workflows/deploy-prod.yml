name: deploy-prod

# Production deploy. Triggered directly by a push to main (e.g. a dev->main
# promotion merge), NOT by workflow_run. Because the run's ref is always main,
# the prod environment-protection gate always sees an allowed branch and passes.
# This avoids the failure where a dev-triggered deploy run instantiated a prod
# job and was rejected ("Branch dev is not allowed to deploy to prod").
#
# The build is run inline via workflow_call so prod only deploys after a green
# build of the main commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}

  deploy:
    needs: build
    uses: ./.github/workflows/_deploy.yml
    with:
      tag: main
      env_name: prod
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      FOXY_CLIENT: ${{ secrets.FOXY_CLIENT }}
      FOXY_ADMIN: ${{ secrets.FOXY_ADMIN }}
      APP_CLOUD_NAME: ${{ secrets.APP_CLOUD_NAME }}
      APP_BUCKET_HOST: ${{ secrets.APP_BUCKET_HOST }}
      PINTEREST_API_HOST: ${{ secrets.PINTEREST_API_HOST }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
