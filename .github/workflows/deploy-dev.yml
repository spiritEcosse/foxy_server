name: deploy-dev

# Dev deploy. Triggered by a successful build on dev (workflow_run). Prod is
# handled separately in deploy-prod.yml (triggered by push to main) so the prod
# environment-protection gate is only ever evaluated on a main ref — a dev build
# can never instantiate a prod job and trip the gate.

on:
  workflow_run:
    workflows: ["build"]
    branches: [dev]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-dev:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/_deploy.yml
    with:
      tag: dev
      env_name: dev
    secrets:
      CR_PAT: ${{ secrets.CR_PAT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      FOXY_CLIENT: ${{ secrets.FOXY_CLIENT }}
      FOXY_ADMIN: ${{ secrets.FOXY_ADMIN }}
      APP_CLOUD_NAME: ${{ secrets.APP_CLOUD_NAME }}
      APP_BUCKET_HOST: ${{ secrets.APP_BUCKET_HOST }}
      PINTEREST_API_HOST: ${{ secrets.PINTEREST_API_HOST }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
